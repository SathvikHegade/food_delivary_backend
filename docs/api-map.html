<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>API Domain Map</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; width:100%; height:100%; font-family:Inter,Arial,sans-serif; background:#111827; color:#f9fafb; overflow:hidden; }
  .toolbar { height:64px; display:flex; align-items:center; gap:8px; padding:10px 16px; background:#1f2937; border-bottom:1px solid #374151; position:relative; z-index:10; }
  .toolbar h1 { font-size:18px; margin:0 18px 0 0; }
  button { border:1px solid #4b5563; background:#374151; color:white; border-radius:8px; padding:9px 13px; cursor:pointer; font-size:14px; }
  button:hover { background:#4b5563; }
  .hint { margin-left:auto; color:#9ca3af; font-size:13px; }
  #viewport { width:100%; height:calc(100vh - 64px); overflow:hidden; cursor:grab; background-image:radial-gradient(#374151 1px, transparent 1px); background-size:24px 24px; }
  #viewport.dragging { cursor:grabbing; }
  #canvas { transform-origin:0 0; position:absolute; left:50%; top:50%; }
  svg { overflow:visible; }
  .node { fill:#111827; stroke:#9ca3af; stroke-width:2; }
  .title { fill:#60a5fa; font-size:22px; font-weight:700; }
  .label { fill:#f9fafb; font-size:16px; font-weight:600; }
  .small { fill:#d1d5db; font-size:13px; }
  .edge { stroke:#9ca3af; stroke-width:2.5; fill:none; marker-end:url(#arrow); }
  .group { fill:#1f2937; stroke:#4b5563; stroke-width:2; rx:16; }
</style>
</head>
<body>
<div class="toolbar">
  <h1>API Domain Map</h1>
  <button onclick="zoom(1.2)">＋ Zoom In</button>
  <button onclick="zoom(0.83)">－ Zoom Out</button>
  <button onclick="pan(-80,0)">← Left</button>
  <button onclick="pan(80,0)">→ Right</button>
  <button onclick="pan(0,-80)">↑ Up</button>
  <button onclick="pan(0,80)">↓ Down</button>
  <button onclick="reset()">⟳ Reset</button>
  <button onclick="fullscreen()">⛶ Full Screen</button>
  <span class="hint">Mouse wheel = zoom · Drag = pan</span>
</div>
<div id="viewport">
  <div id="canvas">
  <svg width="1200" height="700" viewBox="0 0 1200 700"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#9ca3af"/></marker></defs>
    <text x="600" y="50" text-anchor="middle" class="title">API Domain Map</text>
    <rect x="450" y="90" width="300" height="90" class="group"/><text x="600" y="145" text-anchor="middle" class="label">Food Delivery API</text>
    <rect x="80" y="300" width="180" height="80" class="group"/><text x="170" y="335" text-anchor="middle" class="label">Authentication</text><text x="170" y="360" text-anchor="middle" class="small">Signup / Login</text><path d="M600 180 L170 300" class="edge"/><rect x="300" y="300" width="180" height="80" class="group"/><text x="390" y="335" text-anchor="middle" class="label">Restaurants</text><text x="390" y="360" text-anchor="middle" class="small">CRUD / Search</text><path d="M600 180 L390 300" class="edge"/><rect x="520" y="300" width="180" height="80" class="group"/><text x="610" y="335" text-anchor="middle" class="label">Food Items</text><text x="610" y="360" text-anchor="middle" class="small">Create / List</text><path d="M600 180 L610 300" class="edge"/><rect x="740" y="300" width="180" height="80" class="group"/><text x="830" y="335" text-anchor="middle" class="label">Cart</text><text x="830" y="360" text-anchor="middle" class="small">Add / Update / Remove</text><path d="M600 180 L830 300" class="edge"/><rect x="960" y="300" width="180" height="80" class="group"/><text x="1050" y="335" text-anchor="middle" class="label">Orders</text><text x="1050" y="360" text-anchor="middle" class="small">Create / Read / Update</text><path d="M600 180 L1050 300" class="edge"/>
    </svg>
  </div>
</div>
<script>
let scale=1, x=0, y=0, dragging=false, sx=0, sy=0, ox=0, oy=0;
const canvas=document.getElementById('canvas');
const viewport=document.getElementById('viewport');

function render() {
  canvas.style.transform=`translate(calc(-50% + ${x}px), calc(-50% + ${y}px)) scale(${scale})`;
}
function zoom(f) { scale=Math.min(4,Math.max(.2,scale*f)); render(); }
function pan(dx,dy) { x+=dx; y+=dy; render(); }
function reset() { scale=1;x=0;y=0;render(); }
function fullscreen() {
  if (!document.fullscreenElement) viewport.requestFullscreen();
  else document.exitFullscreen();
}
viewport.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?1.1:.9)},{passive:false});
viewport.addEventListener('mousedown',e=>{dragging=true;sx=e.clientX;sy=e.clientY;ox=x;oy=y;viewport.classList.add('dragging')});
window.addEventListener('mouseup',()=>{dragging=false;viewport.classList.remove('dragging')});
window.addEventListener('mousemove',e=>{if(!dragging)return;x=ox+e.clientX-sx;y=oy+e.clientY-sy;render()});
render();
</script>
</body>
</html>
